# ---- Database (PostgreSQL). Credentials come from environment variables. ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:neurocalm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA: Flyway owns the schema, Hibernate only reads/writes data ----
# (Change "none" to "validate" if you want Hibernate to check the schema at startup.)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Server ----
server.port=${SERVER_PORT:8080}
